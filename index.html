<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S — Ultra Pro Max</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
:root{--bg:#070b14;--card:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--accent:#38bdf8;--accent2:#6366f1;--text:#e2e8f0;--muted:#94a3b8;--grad:linear-gradient(135deg,#38bdf8,#6366f1);--gold:linear-gradient(135deg,#fbbf24,#f59e0b);}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Poppins',sans-serif;overflow-x:hidden;}
h1,h2,.logo{font-family:'Orbitron',sans-serif;}
.muted{color:var(--muted);}
section{padding:70px 0;}
.wrap{max-width:1150px;margin:auto;padding:0 20px;position:relative;z-index:2;}
h2.sec{text-align:center;font-size:clamp(1.5rem,4vw,2.1rem);letter-spacing:3px;margin-bottom:8px;}
p.secsub{text-align:center;color:var(--muted);margin-bottom:40px;font-weight:300;}
#preloader{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:.6s;}
#preloader.hide{opacity:0;pointer-events:none;}
.pl-logo{font-family:'Orbitron';font-size:2rem;font-weight:800;letter-spacing:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:plpulse 1.2s infinite;}
@keyframes plpulse{50%{opacity:.5;transform:scale(.97);}}
.pl-bar{width:200px;height:4px;background:#1e293b;border-radius:4px;overflow:hidden;}
.pl-fill{height:100%;width:40%;background:var(--grad);border-radius:4px;animation:plload 1.1s infinite;}
@keyframes plload{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
.orb{position:fixed;border-radius:50%;filter:blur(130px);opacity:.25;z-index:0;pointer-events:none;animation:float 12s ease-in-out infinite;}
.orb1{width:450px;height:450px;background:#0ea5e9;top:-120px;left:-120px;}
.orb2{width:400px;height:400px;background:#6366f1;bottom:-100px;right:-100px;animation-delay:-4s;}
.orb3{width:280px;height:280px;background:#8b5cf6;top:45%;left:65%;animation-delay:-8s;}
@keyframes float{50%{transform:translateY(-40px) translateX(30px);}}
nav{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:14px 5%;background:rgba(7,11,20,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.logo{font-size:1.35rem;font-weight:800;letter-spacing:3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;}
.navlinks{display:flex;gap:22px;flex-wrap:wrap;}
.navlinks a{color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500;transition:.2s;}
.navlinks a:hover{color:var(--accent);}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
select{background:#0f172a;color:var(--text);border:1px solid var(--border);padding:9px 13px;border-radius:10px;font-family:inherit;cursor:pointer;outline:none;}
.btn-primary{background:var(--grad);color:#fff;border:none;padding:11px 26px;border-radius:12px;font-family:'Poppins';font-weight:600;cursor:pointer;transition:.25s;box-shadow:0 4px 20px rgba(56,189,248,.35);font-size:.95rem;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(56,189,248,.5);}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);padding:10px 22px;border-radius:12px;font-family:'Poppins';font-weight:500;cursor:pointer;transition:.25s;font-size:.9rem;}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-primary.full{width:100%;padding:13px;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;}
#userArea{display:none;gap:10px;align-items:center;}
#userName{font-weight:600;font-size:.9rem;}
.hero{text-align:center;padding:75px 0 55px;position:relative;z-index:2;}
.badge{display:inline-block;padding:7px 18px;border:1px solid var(--border);border-radius:30px;font-size:.8rem;color:var(--accent);background:var(--card);margin-bottom:22px;backdrop-filter:blur(8px);}
.reactor{width:175px;height:175px;margin:0 auto 28px;position:relative;}
.reactor .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);}
.ring:nth-child(1){animation:spin 8s linear infinite;border-style:dashed;opacity:.6;}
.ring:nth-child(2){inset:22px;animation:spin 5s linear infinite reverse;opacity:.4;}
.core{position:absolute;inset:55px;border-radius:50%;background:var(--grad);box-shadow:0 0 50px rgba(56,189,248,.8),0 0 120px rgba(99,102,241,.4);animation:pulse 2.5s ease-in-out infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{50%{transform:scale(.94);opacity:.8;}}
h1{font-size:clamp(2.4rem,7vw,4.5rem);letter-spacing:6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{color:var(--muted);margin:12px 0 26px;font-size:1.05rem;font-weight:300;}
.status-card{background:var(--card);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(12px);max-width:620px;margin:0 auto 30px;padding:20px 24px;text-align:left;font-family:'Courier New',monospace;font-size:.88rem;min-height:150px;color:#7dd3fc;}
.status-card .cursor{animation:blink .8s infinite;}
@keyframes blink{50%{opacity:0;}}
.cta{font-size:1.15rem;padding:18px 48px;border-radius:16px;font-family:'Orbitron';letter-spacing:2px;}
.note{margin-top:14px;font-size:.85rem;color:var(--muted);}
.reveal{opacity:0;transform:translateY(35px);transition:.7s ease;}
.reveal.visible{opacity:1;transform:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;backdrop-filter:blur(12px);transition:.3s;}
.card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 12px 35px rgba(56,189,248,.15);}
.card .icon{font-size:2.2rem;}
.card h3{margin:12px 0 8px;font-size:1.05rem;}
.card p{color:var(--muted);font-size:.88rem;font-weight:300;}
.browser{max-width:680px;margin:auto;background:#0f172a;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.5);}
.bbar{display:flex;gap:7px;align-items:center;padding:12px 16px;background:#1e293b;}
.dot{width:12px;height:12px;border-radius:50%;}
.dot.r{background:#f87171;}.dot.y{background:#fbbf24;}.dot.g{background:#4ade80;}
.burl{margin-left:10px;font-size:.75rem;color:var(--muted);background:#0f172a;padding:5px 14px;border-radius:8px;}
.bbody{padding:22px;display:flex;flex-direction:column;gap:10px;min-height:190px;}
.msg{padding:11px 15px;border-radius:14px;max-width:78%;font-size:.88rem;}
.msg.j{background:#1e293b;border:1px solid #334155;}
.msg.u{background:var(--grad);color:#fff;margin-left:auto;}
.theme-dots{display:flex;gap:10px;justify-content:center;margin-top:22px;}
.tdot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.2s;}
.tdot:hover{transform:scale(1.2);}
.stats{display:flex;flex-wrap:wrap;gap:45px;justify-content:center;text-align:center;}
.stat b{font-family:'Orbitron';font-size:2.3rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;}
.stat span{color:var(--muted);font-size:.88rem;}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;align-items:stretch;}
.plan{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:34px 28px;backdrop-filter:blur(12px);transition:.3s;position:relative;display:flex;flex-direction:column;}
.plan:hover{transform:translateY(-8px);box-shadow:0 18px 45px rgba(56,189,248,.15);}
.plan.featured{border:2px solid var(--accent);background:linear-gradient(180deg,rgba(56,189,248,.08),rgba(99,102,241,.08));}
.plan .tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--grad);color:#fff;font-size:.7rem;font-weight:700;padding:5px 16px;border-radius:20px;letter-spacing:1px;white-space:nowrap;}
.plan.gold .tag{background:var(--gold);}
.plan h3{font-family:'Orbitron';letter-spacing:2px;font-size:1.1rem;}
.price{font-family:'Orbitron';font-size:2.6rem;font-weight:800;margin:14px 0 4px;}
.price small{font-size:.9rem;color:var(--muted);font-family:'Poppins';font-weight:400;}
.plan ul{list-style:none;margin:20px 0 26px;flex:1;}
.plan li{padding:7px 0;color:var(--muted);font-size:.9rem;font-weight:300;}
.plan li::before{content:'✔ ';color:var(--accent);font-weight:700;}
.testi{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;backdrop-filter:blur(12px);transition:.3s;}
.testi:hover{transform:translateY(-5px);border-color:var(--accent);}
.stars{color:#fbbf24;letter-spacing:3px;margin-bottom:12px;}
.testi p{font-size:.9rem;font-weight:300;color:var(--text);margin-bottom:16px;}
.tuser{display:flex;gap:12px;align-items:center;}
.tav{width:42px;height:42px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;}
.tuser b{display:block;font-size:.9rem;}
.tuser span{font-size:.78rem;color:var(--muted);}
.faq{max-width:720px;margin:auto;}
.faq-item{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;backdrop-filter:blur(10px);}
.faq-q{width:100%;background:none;border:none;color:var(--text);padding:18px 22px;text-align:left;font-family:'Poppins';font-weight:600;font-size:.95rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.faq-q span{transition:.3s;color:var(--accent);font-size:1.2rem;}
.faq-item.open .faq-q span{transform:rotate(45deg);}
.faq-a{max-height:0;overflow:hidden;transition:.35s;color:var(--muted);font-size:.88rem;font-weight:300;}
.faq-a div{padding:0 22px 18px;}
.faq-item.open .faq-a{max-height:200px;}
.contact-box{max-width:600px;margin:auto;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:34px;backdrop-filter:blur(12px);}
.field{margin-bottom:14px;position:relative;}
.field input,.field textarea{width:100%;background:#1e293b;border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:#fff;font-family:'Poppins';outline:none;transition:.2s;font-size:.93rem;resize:vertical;}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15);}
footer{border-top:1px solid var(--border);padding:45px 5% 25px;position:relative;z-index:2;}
.fgrid{display:flex;flex-wrap:wrap;gap:35px;justify-content:space-between;max-width:1150px;margin:auto;}
.fcol h4{font-family:'Orbitron';font-size:.95rem;letter-spacing:2px;margin-bottom:14px;}
.fcol a{display:block;color:var(--muted);text-decoration:none;font-size:.87rem;padding:4px 0;transition:.2s;font-weight:300;}
.fcol a:hover{color:var(--accent);}
.socials{display:flex;gap:12px;margin-top:14px;}
.socials a{width:38px;height:38px;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;transition:.25s;text-decoration:none;font-size:1rem;}
.socials a:hover{border-color:var(--accent);transform:translateY(-3px);}
.copyright{text-align:center;color:var(--muted);font-size:.82rem;margin-top:35px;padding-top:20px;border-top:1px solid var(--border);font-weight:300;}
.modal{position:fixed;inset:0;background:rgba(2,6,17,.85);backdrop-filter:blur(8px);display:none;z-index:90;align-items:center;justify-content:center;padding:20px;}
.modal.open{display:flex;}
.auth-box{background:#0f172a;border:1px solid var(--border);border-radius:22px;padding:36px;max-width:420px;width:100%;position:relative;box-shadow:0 25px 60px rgba(0,0,0,.6);animation:pop .3s;max-height:92vh;overflow-y:auto;}
@keyframes pop{from{transform:scale(.92);opacity:0;}}
.close{position:absolute;top:16px;right:18px;background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;}
.close:hover{color:#fff;}
.tabs{display:flex;background:#1e293b;border-radius:12px;padding:5px;margin-bottom:22px;}
.tab{flex:1;padding:10px;border:none;background:transparent;color:var(--muted);border-radius:9px;cursor:pointer;font-family:'Poppins';font-weight:600;transition:.25s;}
.tab.active{background:var(--grad);color:#fff;}
.auth-box h2{font-size:1.25rem;margin-bottom:4px;}
.auth-box .muted{font-size:.84rem;margin-bottom:18px;}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;opacity:.6;}
.err{color:#f87171;font-size:.83rem;min-height:20px;margin-bottom:8px;}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:.78rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.btn-google{width:100%;padding:12px;background:#fff;color:#1f2937;border:none;border-radius:12px;font-family:'Poppins';font-weight:600;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-google:hover{background:#e5e7eb;}
.demo-note{margin-top:14px;font-size:.73rem;color:#fbbf24;text-align:center;}
.forgot{display:block;text-align:right;font-size:.8rem;color:var(--accent);background:none;border:none;cursor:pointer;font-family:'Poppins';margin:-6px 0 12px;}
.forgot:hover{text-decoration:underline;}
.inst-box{background:#0f172a;border:1px solid var(--border);border-radius:22px;padding:34px;max-width:480px;width:100%;animation:pop .3s;}
.bar{height:14px;background:#1e293b;border-radius:8px;margin:20px 0;overflow:hidden;}
.fill{height:100%;width:0;background:var(--grad);border-radius:8px;transition:width .5s;box-shadow:0 0 15px rgba(56,189,248,.6);}
#instLog{font-family:'Courier New',monospace;font-size:.83rem;min-height:115px;color:#7dd3fc;white-space:pre-line;}
.done{color:#4ade80;font-weight:bold;}
.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;border:1px solid var(--accent);color:#fff;padding:14px 22px;border-radius:14px;z-index:99;transform:translateY(130px);transition:.4s;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:.88rem;max-width:320px;}
.toast.show{transform:translateY(0);}
#topBtn{position:fixed;bottom:24px;left:24px;width:44px;height:44px;border-radius:12px;background:var(--grad);color:#fff;border:none;font-size:1.2rem;cursor:pointer;z-index:80;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 6px 20px rgba(56,189,248,.4);}
#topBtn.show{opacity:1;pointer-events:auto;}
[dir="rtl"] .status-card,[dir="rtl"] .faq-q{text-align:right;}
@media(max-width:750px){.navlinks{display:none;}}
</style>
</head>
<body>

<div id="preloader">
  <div class="pl-logo">J.A.R.V.I.S</div>
  <div class="pl-bar"><div class="pl-fill"></div></div>
</div>

<div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>

<nav>
  <div class="logo" onclick="scrollTo({top:0,behavior:'smooth'})">J.A.R.V.I.S</div>
  <div class="navlinks" id="navlinks"></div>
  <div class="controls">
    <select id="langSel" onchange="setLang(this.value)">
      <option value="en">🌐 English</option>
      <option value="ur">🌐 اردو</option>
      <option value="hi">🌐 हिंदी</option>
    </select>
    <div class="controls" id="authArea">
      <button class="btn-ghost" id="loginBtn" onclick="openAuth('login')">Login</button>
      <button class="btn-primary" id="signupBtn" onclick="openAuth('signup')">Sign Up</button>
    </div>
    <div id="userArea">
      <div class="avatar" id="avatar">J</div>
      <span id="userName"></span>
      <button class="btn-ghost" id="logoutBtn" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <div class="badge" id="t-badge"></div>
    <div class="reactor"><div class="ring"></div><div class="ring"></div><div class="core"></div></div>
    <h1>J.A.R.V.I.S</h1>
    <p class="sub" id="t-sub"></p>
    <div class="status-card" id="term"></div>
    <button class="btn-primary cta" id="t-btn" onclick="downloadJarvis()">⬇ DOWNLOAD JARVIS</button>
    <p class="note" id="t-note"></p>
  </div>
</div>

<section id="features"><div class="wrap">
  <h2 class="sec reveal" id="t-feat"></h2>
  <p class="secsub reveal" id="t-featsub"></p>
  <div class="grid reveal" id="featGrid"></div>
</div></section>

<section id="demo"><div class="wrap">
  <h2 class="sec reveal" id="t-show"></h2>
  <p class="secsub reveal" id="t-showsub"></p>
  <div class="browser reveal">
    <div class="bbar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="burl">JARVIS-UltraProMax.html</span></div>
    <div class="bbody">
      <div class="msg j">⚡ JARVIS CORE v9.9 ULTRA PRO MAX — Online</div>
      <div class="msg u">calc 125 * 8 + 42</div>
      <div class="msg j">🧮 125 * 8 + 42 = 1042</div>
      <div class="msg u">theme gold</div>
      <div class="msg j">✨ Gold theme activated, Boss!</div>
    </div>
  </div>
  <div class="theme-dots reveal">
    <div class="tdot" style="background:#00ff41;" title="Matrix"></div>
    <div class="tdot" style="background:#00d4ff;" title="Ice"></div>
    <div class="tdot" style="background:#ff2a6d;" title="Cyber"></div>
    <div class="tdot" style="background:#ffd700;" title="Gold"></div>
  </div>
</div></section>

<section><div class="wrap">
  <div class="stats reveal">
    <div class="stat"><b data-count="250000">0</b><span id="t-s1"></span></div>
    <div class="stat"><b data-count="99">0</b><span id="t-s2"></span></div>
    <div class="stat"><b data-count="4">0</b><span id="t-s3"></span></div>
    <div class="stat"><b data-count="24">0</b><span id="t-s4"></span></div>
  </div>
</div></section>

<section id="pricing"><div class="wrap">
  <h2 class="sec reveal" id="t-price"></h2>
  <p class="secsub reveal" id="t-pricesub"></p>
  <div class="plans reveal" id="plansGrid"></div>
</div></section>

<section id="reviews"><div class="wrap">
  <h2 class="sec reveal" id="t-testi"></h2>
  <p class="secsub reveal" id="t-testisub"></p>
  <div class="grid reveal" id="testiGrid"></div>
</div></section>

<section id="faq"><div class="wrap">
  <h2 class="sec reveal" id="t-faq"></h2>
  <p class="secsub reveal" id="t-faqsub"></p>
  <div class="faq reveal" id="faqList"></div>
</div></section>

<section id="contact"><div class="wrap">
  <h2 class="sec reveal" id="t-contact"></h2>
  <p class="secsub reveal" id="t-contactsub"></p>
  <div class="contact-box reveal">
    <div class="field"><input id="cName" placeholder=""></div>
    <div class="field"><input id="cEmail" type="email" placeholder=""></div>
    <div class="field"><textarea id="cMsg" rows="4" placeholder=""></textarea></div>
    <button class="btn-primary full" id="cSend" onclick="sendContact()"></button>
  </div>
</div></section>

<footer>
  <div class="fgrid">
    <div class="fcol" style="max-width:280px;">
      <div class="logo" style="margin-bottom:12px;">J.A.R.V.I.S</div>
      <p class="muted" style="font-size:.85rem;font-weight:300;" id="t-footdesc"></p>
      <div class="socials">
        <a href="#">𝕏</a><a href="#">▶</a><a href="#">📷</a><a href="#">💬</a>
      </div>
    </div>
    <div class="fcol"><h4 id="t-fl1"></h4><div id="footLinks1"></div></div>
    <div class="fcol"><h4 id="t-fl2"></h4><div id="footLinks2"></div></div>
  </div>
  <div class="copyright" id="t-foot"></div>
</footer>

<div class="modal" id="authModal">
  <div class="auth-box">
    <button class="close" onclick="closeAuth()">✕</button>
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">Login</button>
      <button class="tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
    </div>
    <h2 id="authTitle"></h2>
    <p class="muted" id="authSub"></p>
    <div class="field" id="nameField" style="display:none;"><input id="authName" placeholder=""></div>
    <div class="field"><input id="authEmail" type="email" placeholder=""></div>
    <div class="field">
      <input id="authPass" type="password" placeholder="">
      <span class="eye" onclick="togglePass()">👁</span>
    </div>
    <button class="forgot" id="forgotBtn" onclick="resetPass()"></button>
    <div class="err" id="authErr"></div>
    <button class="btn-primary full" id="authSubmit" onclick="submitAuth()"></button>

<script>
var chat=document.getElementById('chat'),soundOn=true;
var notes=JSON.parse(localStorage.getItem('jv_notes')||'[]');
setInterval(function(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();},1000);
function setTheme(t){document.body.dataset.theme=t;}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';}
function speak(t){if(!soundOn)return;try{var s=new SpeechSynthesisUtterance(t.replace(/[^\x00-\x7F\u0600-\u06FF\u0900-\u097F\s.,!?]/g,''));s.rate=1.05;s.pitch=.85;speechSynthesis.speak(s);}catch(e){}}
function add(t,c,noSpeak){var d=document.createElement('div');d.className='msg '+c;chat.appendChild(d);chat.scrollTop=1e9;
  if(c==='jarvis'){var i=0;var iv=setInterval(function(){d.textContent=t.slice(0,++i);chat.scrollTop=1e9;if(i>=t.length)clearInterval(iv);},10);if(!noSpeak)speak(t);}
  else d.textContent=t;}
function showTyping(){var d=document.createElement('div');d.className='msg jarvis typing';d.id='typing';d.innerHTML='<i></i><i></i><i></i>';chat.appendChild(d);chat.scrollTop=1e9;}
function hideTyping(){var t=document.getElementById('typing');if(t)t.remove();}
function boot(){var lines=['> JARVIS CORE v9.9 ULTRA PRO MAX','> AI Brain................. LOADED','> Voice Engine............. ONLINE','> Smart Tools.............. READY','> Security Shield.......... ACTIVE','','Welcome back, Boss ⚡ Type "help" for commands.'];var i=0;var t=setInterval(function(){add(lines[i],'jarvis',true);i++;if(i>=lines.length){clearInterval(t);speak('Welcome back boss');}},300);}
boot();
var jokes=['Why do programmers prefer dark mode? Because light attracts bugs! 😄','Main AI hoon... meri salary bijli mein milti hai! ⚡','I told a UDP joke once... not sure if anyone got it. 😅','Why did the computer go to the doctor? It had a virus! 🤒','Parallel lines have so much in common... shame they never meet. 📐'];
function calc(expr){if(!/^[\d+\-/*.() %^]+$/.test(expr))return '❌ Invalid expression, Boss.';try{var r=Function('return ('+expr.replace(/%/g,'/100')+')')();if(r===undefined||isNaN(r))return '❌ Could not calculate.';return '🧮 '+expr+' = '+r;}catch(e){return '❌ Could not calculate.';}}
function reply(c){
var l=c.toLowerCase().trim();
if(/^(hi|hello|hey|salam|assalam)/.test(l))return 'Hello Boss! All systems at your service ⚡';
if(l.indexOf('time')>-1||l.indexOf('waqt')>-1)return '⏰ Current time: '+new Date().toLocaleTimeString();
if(l.indexOf('date')>-1||l.indexOf('tareekh')>-1||l.indexOf('din')>-1)return '📅 Today is '+new Date().toDateString();
if(l.indexOf('calc ')>-1||l.indexOf('calculate ')>-1)return calc(c.replace(/calc|calculate/i,'').trim());
if(l.indexOf('joke')>-1)return jokes[Math.floor(Math.random()*jokes.length)];
if(l.indexOf('note add ')>-1){var n=c.substring(9).trim();if(!n)return '❌ Usage: note add <your note>';notes.push(n);localStorage.setItem('jv_notes',JSON.stringify(notes));return '📝 Note saved, Boss! Total notes: '+notes.length;}
if(l==='notes'||l==='my notes'){if(!notes.length)return '📝 No notes saved yet. Try: note add buy milk';return '📝 Your Notes:\n'+notes.map(function(n,i){return (i+1)+'. '+n;}).join('\n');}
if(l.indexOf('clear notes')>-1){notes=[];localStorage.setItem('jv_notes','[]');return '🗑 All notes deleted, Boss.';}
if(l.indexOf('open google')>-1){window.open('https://google.com');return 'Opening Google, Boss...';}
if(l.indexOf('open youtube')>-1){window.open('https://youtube.com');return 'Opening YouTube, Boss...';}
if(l.indexOf('open github')>-1){window.open('https://github.com');return 'Opening GitHub, Boss...';}
if(l.indexOf('open gmail')>-1){window.open('https://mail.google.com');return 'Opening Gmail, Boss...';}
if(l.indexOf('theme ')>-1){var th=l.replace('theme ','').trim();if(['matrix','ice','cyber','gold'].indexOf(th)>-1){setTheme(th);return '✨ '+th.charAt(0).toUpperCase()+th.slice(1)+' theme activated, Boss!';}return '❌ Themes: matrix, ice, cyber, gold';}
if(l.indexOf('timer ')>-1){var sec=parseInt(l.replace('timer ',''));if(isNaN(sec)||sec<=0)return '❌ Usage: timer 30 (seconds)';setTimeout(function(){add('⏰ Time is up, Boss! '+sec+' seconds completed!','jarvis');},sec*1000);return '⏱ Timer set for '+sec+' seconds...';}
if(l.indexOf('hack')>-1)return '💀 Initiating hack sequence...\n[██░░░░░░░░] 20%\n[█████░░░░░] 50%\n[██████████] 100%\nAccess granted... Just kidding Boss 😄 Ethical hacking only!';
if(l.indexOf('your name')>-1||l.indexOf('who are you')>-1||l.indexOf('naam')>-1)return 'I am J.A.R.V.I.S — Just A Rather Very Intelligent System. Ultra Pro Max Edition ⚡';
if(l.indexOf('creator')>-1||l.indexOf('who made')>-1||l.indexOf('kis ne banaya')>-1)return 'I was crafted by my Boss — the legend himself 😎';
if(l.indexOf('love')>-1)return 'I am just code, Boss... but I like you too 💚';
if(l.indexOf('thank')>-1||l.indexOf('shukriya')>-1)return 'Always at your service, Boss! 🫡';
if(l.indexOf('help')>-1)return '⚡ JARVIS COMMANDS ⚡\n\n💬 Basics: hello, time, date, joke\n🧮 calc 25*4+10 — smart calculator\n📝 note add <text> / notes / clear notes\n⏱ timer 30 — countdown timer\n🌐 open google / youtube / github / gmail\n🎨 theme matrix / ice / cyber / gold\n💀 hack — fun mode\n🧹 clear — clear screen';
if(l==='clear'){chat.innerHTML='';return '🧹 Screen cleared, Boss.';}
return '🤔 Hmm... "'+c+'" — still learning that one, Boss. Type "help" for all commands.';
}
function send(){var i=document.getElementById('cmd');var v=i.value.trim();if(!v)return;add(v,'you');i.value='';showTyping();setTimeout(function(){hideTyping();add(reply(v),'jarvis');},600+Math.random()*500);}
function chip(c){document.getElementById('cmd').value=c;send();}
function voice(){var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add('Voice not supported in this browser, Boss. Try Chrome.','jarvis');return;}var r=new R();r.onresult=function(e){document.getElementById('cmd').value=e.results[0][0].transcript;send();};r.start();add('🎤 Listening...','jarvis',true);}

function sendContact(){
  const t=T[lang];
  const name=$('cName').value.trim(),email=$('cEmail').value.trim(),msg=$('cMsg').value.trim();
  if(!name||!email||!msg){toast(t.errFill);return;}
  const msgs=JSON.parse(localStorage.getItem('jv_contact')||'[]');
  msgs.push({name:name,email:email,message:msg,at:new Date().toISOString()});
  localStorage.setItem('jv_contact',JSON.stringify(msgs));
  $('cName').value='';$('cEmail').value='';$('cMsg').value='';
  toast(t.cSent);
}

const termLines=["> Initializing JARVIS core v9.9...","> Loading AI modules........ OK","> Voice engine.............. ONLINE","> Smart tools............... READY","> Security shield........... ACTIVE","","> System ready. Welcome, Boss. ⚡"];
const term=$('term');let li=0,ci=0,out='';
(function type(){
  if(li>=termLines.length){term.innerHTML=out+'<span class="cursor">█</span>';return;}
  out+=termLines[li][ci]||'';ci++;
  if(ci>termLines[li].length){out+='\n';li++;ci=0;}
  term.innerHTML=out.replace(/\n/g,'<br>')+'<span class="cursor">█</span>';
  setTimeout(type,24);
})();

document.querySelectorAll('[data-count]').forEach(el=>{
  const target=+el.dataset.count;let n=0;
  const step=()=>{n+=Math.ceil(target/60);if(n>=target)n=target;
    el.textContent=n.toLocaleString()+(target>100?'+':'');if(n<target)requestAnimationFrame(step);};
  setTimeout(step,500);
});

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200);}

let authMode='login';
function openAuth(m){switchTab(m);$('authModal').classList.add('open');}
function closeAuth(){$('authModal').classList.remove('open');$('authErr').textContent='';}
function switchTab(m){authMode=m;$('tabLogin').classList.toggle('active',m==='login');$('tabSignup').classList.toggle('active',m==='signup');updateAuthTexts();}
function updateAuthTexts(){const t=T[lang];
  $('nameField').style.display=(authMode==='signup')?'block':'none';
  $('forgotBtn').style.display=(authMode==='login')?'block':'none';
  $('authTitle').textContent=(authMode==='login')?t.loginTitle:t.signupTitle;
  $('authSub').textContent=(authMode==='login')?t.loginSub:t.signupSub;
  $('authSubmit').textContent=(authMode==='login')?t.login:t.signup;}
function togglePass(){const p=$('authPass');p.type=(p.type==='password')?'text':'password';}
function renderAuthUI(){
  if(currentUser){$('authArea').style.display='none';$('userArea').style.display='flex';
    $('userName').textContent=currentUser.name;$('avatar').textContent=currentUser.name.charAt(0).toUpperCase();}
  else{$('authArea').style.display='flex';$('userArea').style.display='none';}
}
function mapErr(code){const t=T[lang];
  if(code==='auth/email-already-in-use')return t.errExists;
  if(code==='auth/weak-password')return t.errWeak;
  if(['auth/wrong-password','auth/user-not-found','auth/invalid-credential','auth/invalid-email'].includes(code))return t.errWrong;
  return t.errGeneral;}
async function submitAuth(){
  const t=T[lang],name=$('authName').value.trim(),email=$('authEmail').value.trim(),pass=$('authPass').value;
  $('authErr').textContent='';
  if(!email||!pass||(authMode==='signup'&&!name)){$('authErr').textContent=t.errFill;return;}
  if(!/^\S+@\S+\.\S+$/.test(email)){$('authErr').textContent=t.errEmail;return;}
  if(pass.length<6){$('authErr').textContent=t.errWeak;return;}
  $('authSubmit').disabled=true;
  try{
    if(firebaseReady){
      if(authMode==='signup'){
        const cred=await auth.createUserWithEmailAndPassword(email,pass);
        await cred.user.updateProfile({displayName:name});
        currentUser={name,email};renderAuthUI();toast(t.accCreated);
      }else{await auth.signInWithEmailAndPassword(email,pass);toast(t.loggedIn);}
    }else{
      const users=JSON.parse(localStorage.getItem('jv_users')||'{}');
      if(authMode==='signup'){
        if(users[email])throw{code:'auth/email-already-in-use'};
        users[email]={name,pass};localStorage.setItem('jv_users',JSON.stringify(users));
        currentUser={name,email};toast(t.accCreated);
      }else{
        if(!users[email]||users[email].pass!==pass)throw{code:'auth/invalid-credential'};
        currentUser={name:users[email].name,email};toast(t.loggedIn);
      }
      localStorage.setItem('jv_session',JSON.stringify(currentUser));renderAuthUI();
    }
    closeAuth();
    if(pendingDownload){pendingDownload=false;setTimeout(downloadJarvis,400);}
  }catch(e){$('authErr').textContent=mapErr(e.code);}
  $('authSubmit').disabled=false;
}
async function googleAuth(){
  if(!firebaseReady){toast(T[lang].demo);return;}
  try{const p=new firebase.auth.GoogleAuthProvider();await auth.signInWithPopup(p);
    toast(T[lang].loggedIn);closeAuth();
    if(pendingDownload){pendingDownload=false;setTimeout(downloadJarvis,400);}
  }catch(e){toast(mapErr(e.code));}
}
async function resetPass(){
  const t=T[lang],email=$('authEmail').value.trim();
  if(!email){$('authErr').textContent=t.errEmail;return;}
  if(!firebaseReady){toast(t.resetDemo);return;}
  try{await auth.sendPasswordResetEmail(email);toast(t.resetSent);}catch(e){$('authErr').textContent=mapErr(e.code);}
}
async function logout(){
  if(firebaseReady&&auth)await auth.signOut();
  localStorage.removeItem('jv_session');currentUser=null;renderAuthUI();toast(T[lang].loggedOut);
}

function downloadJarvis(){
  const t=T[lang];
  if(!currentUser){pendingDownload=true;toast(t.needLogin);openAuth('login');return;}
  const src=$('jarvisAppSource').textContent.trim().replace(/<\\\/script>/g,'<\/script>');
  const blob=new Blob([src],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='JARVIS-UltraProMax.html';a.click();URL.revokeObjectURL(a.href);
  $('installModal').classList.add('open');$('closeInstBtn').style.display='none';
  const log=$('instLog'),fill=$('fill');log.innerHTML='';fill.style.width='0%';
  t.steps.forEach((s,i)=>{setTimeout(()=>{
    fill.style.width=((i+1)/t.steps.length*100)+'%';
    log.innerHTML+=(i===t.steps.length-1?'<span class="done">'+s+'</span>':s)+'\n';
    if(i===t.steps.length-1)$('closeInstBtn').style.display='block';
  },700*(i+1));});
}
function closeInstall(){$('installModal').classList.remove('open');}

setLang('en');renderAuthUI();
